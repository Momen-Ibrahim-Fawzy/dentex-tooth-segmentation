# U-Net training, shared by all tasks (--task selects the data folder and the number of classes).
# Defaults follow the course experiments: Adam (lr 1e-3), batch 4, 35 epochs, 80/20 split,
# horizontal flip + 5% salt-and-pepper augmentation.
seed: 0
data_root: data/prepared/{task}     # images/ and masks/ from scripts/make_masks.py
output_dir: runs/unet
val_fraction: 0.2
base_channels: 32                   # 32 -> 512 channels over 4 levels (7.8M parameters)
dropout: 0.3
batch_size: 4
workers: 4
lr: 1.0e-3
epochs: 35
patience: 10                        # early stopping on validation Dice
